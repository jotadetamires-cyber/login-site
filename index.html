<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Relatório Epidemiológico - Metarica</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; background: #f7f9fb; }
h1, h2 { color: #004080; }
label { margin-right: 10px; }
select { margin-bottom: 20px; padding: 5px; }
.report-section { margin-bottom: 20px; padding: 10px; background: #fff; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid #ccc; padding: 5px; text-align: center; }
th { background: #e2e2e2; }
</style>
</head>
<body>

<h1>Relatório Epidemiológico - SDSMAS Metarica</h1>

<label for="periodo">Selecione o Período:</label>
<select id="periodo" onchange="atualizarRelatorio()">
  <option value="2025-08">Agosto 2025</option>
  <option value="2024-08">Agosto 2024</option>
</select>

<div id="relatorio"></div>

<script>
// Dados de exemplo (você pode expandir para todos os indicadores)
const dados = {
  "2025-08": {
    "consultas_externas": {realizado: 9192, previsto: 7450},
    "malaria": {casos: 2435, sem_obito: true, anterior: 1765},
    "sarampo": {realizado: 315, previsto: 264, anterior: 265},
    "diarreia": {casos: 51, anterior: 41},
    "disenteria": {casos: 10, anterior: 9},
    "hiv_testados": {realizado: 594, positivos: 9, anterior: 782, anterior_positivos: 7},
    "cancro_uterino": {rastreadas: 136, positivas: 7, anterior_rastreadas: 205},
    "partos": {realizado: 309, previsto: 228, anterior: 295},
    "tip": {administradas: 265, previsto: 289, anterior: 311},
    "internados": {total: 30, anterior: 47},
    "cpn": {realizado: 498, previsto: 253, anterior: 302},
    "pos_parto": {realizado: 309, previsto: 228, anterior: 312},
    "redes": {distribuidas: 411, inscritas: 455, anterior: 296},
    "tb": {diagnosticados: 11, esperados: 14, anterior: 9},
    "planeamento_familiar": {consultas: 446, esperado: 1008, anterior: 965},
    "baixo_peso": {nados_vivos: 309, <2_5kg: 7, anterior: 0},
    "vitamina_a": {suplementadas: 1415, esperado: 881, anterior: 1265},
    "saude_oral": {consultas: 101, anterior: 98, cáries: 40, cáries_anterior: 30, exodontias: 61, exodontias_anterior: 21}
  },
  "2024-08": {
    "consultas_externas": {realizado: 7450, previsto: 7000},
    "malaria": {casos: 1765, sem_obito: true},
    "sarampo": {realizado: 265, previsto: 264},
    "diarreia": {casos: 41},
    "disenteria": {casos: 9},
    "hiv_testados": {realizado: 782, positivos: 7},
    "cancro_uterino": {rastreadas: 205, positivas: 0},
    "partos": {realizado: 295, previsto: 228},
    "tip": {administradas: 311, previsto: 289},
    "internados": {total: 47},
    "cpn": {realizado: 302, previsto: 253},
    "pos_parto": {realizado: 312, previsto: 228},
    "redes": {distribuidas: 296, inscritas: 455},
    "tb": {diagnosticados: 9, esperados: 14},
    "planeamento_familiar": {consultas: 965, esperado: 1008},
    "baixo_peso": {nados_vivos: 309, <2_5kg: 0},
    "vitamina_a": {suplementadas: 1265, esperado: 881},
    "saude_oral": {consultas: 98, cáries: 30, exodontias: 21}
  }
};

function calcularVariacao(valorAtual, valorAnterior) {
  if (!valorAnterior || valorAnterior === 0) return "-";
  return (((valorAtual - valorAnterior)/valorAnterior)*100).toFixed(1) + "%";
}

function calcularCobertura(realizado, previsto) {
  if (!previsto || previsto === 0) return "-";
  return ((realizado / previsto) * 100).toFixed(1) + "%";
}

function atualizarRelatorio() {
  const periodo = document.getElementById('periodo').value;
  const r = dados[periodo];
  const rAnterior = periodo === "2025-08" ? dados["2024-08"] : dados["2025-08"];

  let html = `<div class="report-section"><h2>Indicadores de Saúde</h2>
    <table>
      <tr><th>Indicador</th><th>Realizado</th><th>Previsto</th><th>Cobertura</th><th>Variação</th></tr>
      <tr><td>Consultas Externas</td><td>${r.consultas_externas.realizado}</td><td>${r.consultas_externas.previsto}</td><td>${calcularCobertura(r.consultas_externas.realizado, r.consultas_externas.previsto)}</td><td>${calcularVariacao(r.consultas_externas.realizado, rAnterior.consultas_externas.realizado)}</td></tr>
      <tr><td>Casos de Malária</td><td>${r.malaria.casos}</td><td>-</td><td>-</td><td>${calcularVariacao(r.malaria.casos, rAnterior.malaria.casos)}</td></tr>
      <tr><td>Vacinação Sarampo</td><td>${r.sarampo.realizado}</td><td>${r.sarampo.previsto}</td><td>${calcularCobertura(r.sarampo.realizado, r.sarampo.previsto)}</td><td>${calcularVariacao(r.sarampo.realizado, rAnterior.sarampo.realizado)}</td></tr>
      <tr><td>Partos Institucionais</td><td>${r.partos.realizado}</td><td>${r.partos.previsto}</td><td>${calcularCobertura(r.partos.realizado, r.partos.previsto)}</td><td>${calcularVariacao(r.partos.realizado, rAnterior.partos.realizado)}</td></tr>
    </table>
  </div>`;

  document.getElementById('relatorio').innerHTML = html;
}

// Inicializa com o primeiro período
atualizarRelatorio();
</script>

</body>
</html>
