<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel DHIS2 - SIDIS</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  body { font-family: Arial, sans-serif; background: #1363b3; margin: 0; padding: 0; }

  /* Barra superior expansível e centralizada */
  #topBar {
    position: fixed;
    top: 50px;
    left: 20px;
    right: 125px;
    background-color: #e3f2fd;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    z-index: 1002;
    padding: 0 12px;
    overflow: hidden;
  }
  /* Imagem ocupando quase toda a página */
  #imagemBar {
    position: fixed;
    top: 100px; /* logo abaixo da barra */
    left: 20px;
    right: 125px;
    bottom: 20px; /* pequena margem inferior */
    border-radius: 10px;
    object-fit: cover;
    width: calc(100% - 145px);
    height: calc(100vh - 120px); /* ocupa quase toda a altura da tela */
    z-index: 900;
    box-shadow: 0 3px 20px rgba(17, 29, 185, 0.3);
  }


  #topText {
    font-family: Impact, Charcoal, sans-serif;
    font-size: 20px;
    color: #1976d2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Botões */
  .menu-btn {
    position: fixed; top: 50px; right: 20px;
    background-color: #1976d2; border: none; width: 44px; height: 44px; border-radius: 6px;
    cursor: pointer; display: grid; grid-template-columns: repeat(3, 8px); grid-template-rows: repeat(3, 8px);
    gap: 4px; justify-content: center; align-content: center; z-index: 1001;
  }
  .menu-btn div { width: 8px; height: 8px; background-color: #fff; border-radius: 2px; }

  .msg-btn {
    position: fixed; top: 50px; right: 75px;
    background-color: #388e3c; border: none; width: 44px; height: 44px; border-radius: 6px;
    color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1001;
  }
  .msg-btn:hover { background-color: #2e7d32; }

  /* Caixa de mensagem reorganizada e adaptativa */
  .msg-box {
    display: none; position: fixed; top: 105px; right: 20px;
    background-color: white; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    padding: 15px; width: 600px; z-index: 1000;
  }
  .msg-box-content {
    display: flex; gap: 15px; height: 320px;
  }
  #mensagensAntigas {
    flex: 1; overflow-y: auto; border-right:1px solid #eee; padding-right:10px;
  }
  #mensagensAntigas div { margin-bottom:10px; padding:6px; border-bottom:1px solid #eee; }
  .msg-inputs {
    flex: 1; display:flex; flex-direction:column; gap:8px; height:100%;
  }
  .msg-inputs input, .msg-inputs textarea { width:100%; border-radius:6px; border:1px solid #ccc; padding:8px; font-family: Arial, sans-serif; }
  .msg-inputs textarea { flex:1; resize:none; }
  .msg-inputs button { margin-top:8px; background-color:#388e3c; border:none; color:white; padding:8px 14px; border-radius:6px; cursor:pointer; }
  .msg-inputs button:hover { background-color:#2e7d32; }

  /* Menu DHIS2 */
  .menu-panel { display: none; position: fixed; top: 105px; right: 20px; background-color: #fff; border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15); padding: 20px; z-index: 1000; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from {opacity:0; transform:translateY(-10px);} to {opacity:1; transform:translateY(0);} }
  .menu-grid { display: grid; grid-template-columns: repeat(2, 140px); gap: 15px; }
  .menu-item { text-align:center; background-color:#e3f2fd; border-radius:10px; padding:15px; transition:all 0.2s ease; cursor:pointer; }
  .menu-item:hover { background-color:#bbdefb; transform:translateY(-3px); }
  .menu-item span { display:block; margin-top:8px; font-weight:bold; color:#0d47a1; }
  .menu-item i { font-size:28px; color:#1976d2; }

  /* Slides */
  .slideshow-container { max-width:100%; position:relative; margin:auto; margin-top:120px; }
  .slide { display:none; text-align:center; padding:20px; animation: fadeSlide 1s ease-in-out; }
  @keyframes fadeSlide { from {opacity:0;} to {opacity:1;} }
  canvas { max-width:700px; margin-top:20px; background-color:#000; }
  .full-width { max-width:95vw !important; width:95vw !important; }

  .kpi-box { display:inline-block; margin:20px; padding:20px 30px; border-radius:10px; background:#e3f2fd; color:#0d47a1; font-size:22px; font-weight:bold; }
  .sidis-info { text-align:left; background:#e3f2fd; color:#0d47a1; border-left:6px solid #1976d2; padding:20px; margin-top:40px; border-radius:10px; max-width:500px; font-size:15px; line-height:1.5; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
  .sidis-wrapper { display:flex; justify-content:center; align-items:flex-start; gap:40px; flex-wrap:wrap; }
  .sidis-info h3 { margin-top:0; color:#0d47a1; }
</style>
</head>
<body>

<!-- Barra superior expansível e centralizada -->
<div id="topBar">
  <span id="topText">DASHBOARD DE PRINCIPAIS INDICADORES - METARICA</span>
</div>
<!-- Imagem abaixo da barra, ocupando quase toda a tela -->
<img id="imagemBar" src="https://i.postimg.cc/sxmz9N15/Screenshot-2025-11-06-165843.png" alt="Painel DHIS2 - Metarica">

<button class="msg-btn" id="msgBtn">✉️</button>
<div class="msg-box" id="msgBox">
  <div class="msg-box-content">
    <!-- Coluna esquerda: mensagens antigas -->
    <div id="mensagensAntigas">
      <i>Nenhuma mensagem ainda.</i>
    </div>

    <!-- Coluna direita: campos de envio -->
    <div class="msg-inputs">
      <input type="text" id="nomeUsuario" placeholder="Seu nome">
      <textarea id="mensagem" placeholder="Escreva seu comentário..."></textarea>
      <button id="enviarMsg">Enviar</button>
    </div>
  </div>
</div>

<button class="menu-btn" id="menuBtn">
  <div></div><div></div><div></div>
  <div></div><div></div><div></div>
  <div></div><div></div><div></div>
</button>

<div class="menu-panel" id="menuPanel">
  <div class="menu-grid">
    <div class="menu-item" onclick="window.open('https://sites.google.com/view/sidis-j/insercao-de-dados', '_blank')"><i>📋</i><span>Inserção</span></div>
    <div class="menu-item" onclick="window.open('https://sites.google.com/view/sidis-j/visualizacao-de-dados', '_blank')"><i>📊</i><span>Visualização</span></div>
    <div class="menu-item" onclick="window.open('https://sites.google.com/view/sidis-j/coberturas', '_blank')"><i>🩺</i><span>Cobertura</span></div>
    <div class="menu-item" onclick="window.open('https://sites.google.com/view/sidis-j/evolucao', '_blank')"><i>📈</i><span>Evolução</span></div>
    <div class="menu-item" onclick="window.open('https://sites.google.com/view/sidis-j/tendencia?authuser=0', '_blank')"><i>📉</i><span>Tendência</span></div>
    <div class="menu-item" onclick="window.open('https://sites.google.com/view/sidis-j/desempenho', '_blank')"><i>🏆</i><span>Desempenho</span></div>
    <div class="menu-item" onclick="window.open('https://sites.google.com/view/sidis-j/percentagem', '_blank')"><i>📑</i><span>Percentagem</span></div>
    <div class="menu-item" onclick="window.open('https://sites.google.com/view/sidis-j/evolucao-geral?authuser=0', '_blank')"><i>SISMA</i><span>Dados Geral</span></div>
  </div>
</div>


<script>
const url="https://script.google.com/macros/s/AKfycbxFKOVfeFEzGAyY8NSfmzJJJro7w5r0bBZ3KF2Taa49Dz7jV9k3OWUxqb24xpprTh0/exec";
const urlMsg="https://script.google.com/macros/s/AKfycbwOyM-Cci1M0epYH9kZVEMDAJ8feeqBpGBrtLEr1yrEBqQOhDelbnMTGjKboGWTm0MS/exec";

const menuBtn=document.getElementById('menuBtn');
const menuPanel=document.getElementById('menuPanel');
menuBtn.addEventListener('click',()=>{menuPanel.style.display=menuPanel.style.display==='block'?'none':'block';});
document.addEventListener('click',e=>{if(!menuPanel.contains(e.target)&&!menuBtn.contains(e.target))menuPanel.style.display='none';});

const msgBtn=document.getElementById('msgBtn');
const msgBox=document.getElementById('msgBox');
msgBtn.addEventListener('click',()=>{msgBox.style.display=msgBox.style.display==='block'?'none':'block';if(msgBox.style.display==='block')carregarMensagens();});
document.addEventListener('click',e=>{if(!msgBox.contains(e.target)&&!msgBtn.contains(e.target))msgBox.style.display='none';});

async function carregarMensagens(){try{
  const res=await fetch(urlMsg+"?action=get");
  const dados=await res.json();
  const c=document.getElementById("mensagensAntigas"); c.innerHTML="";
  if(dados.length===0){c.innerHTML="<i>Nenhuma mensagem ainda.</i>"; return;}
  dados.reverse().forEach(d=>{
    const el=document.createElement("div");
    el.innerHTML=`<b>${d.nome}</b> <span style="font-size:12px;color:#555">(${d.data})</span><br>${d.mensagem}`;
    c.appendChild(el);
  });
  c.scrollTop=c.scrollHeight;
}catch(e){console.error(e);}}

document.getElementById('enviarMsg').addEventListener('click',async()=>{
  const n=document.getElementById('nomeUsuario').value.trim();
  const m=document.getElementById('mensagem').value.trim();
  if(!n) return alert("Informe seu nome.");
  if(!m) return alert("Escreva uma mensagem.");
  try{
    await fetch(urlMsg+"?nome="+encodeURIComponent(n)+"&mensagem="+encodeURIComponent(m));
    alert("Mensagem enviada!");
    document.getElementById('mensagem').value="";
    document.getElementById('nomeUsuario').value="";
    carregarMensagens();
  }catch(e){alert("Erro ao enviar.");}
});

let slideIndex=0;const slides=document.getElementsByClassName("slide");
function showSlides(){for(let i=0;i<slides.length;i++)slides[i].style.display="none";slideIndex++;if(slideIndex>slides.length)slideIndex=1;slides[slideIndex-1].style.display="block";setTimeout(showSlides,7000);}
showSlides();

async function carregarDados(){
  const r=await fetch(url);
  const dados=await r.json();
  if(!dados.length)return;
  const ult=dados[dados.length-1];
  document.getElementById("kpis").innerHTML=`<div class="kpi-box">Consultas Externas: ${ult["C.Externas (US)"]||0}</div><div class="kpi-box">Activos TARV: ${ult["Activos TARV"]||0}</div><div class="kpi-box">Partos Institucionais: ${ult["Partos Institucionais"]||0}</div>`;
  gerarGraficos(dados);
}

function gerarGraficos(d){
  const meses=d.map(x=>x.Periodo);
  const consultas=d.map(x=>+x["C.Externas (US)"]||0);
  const malaria=d.map(x=>+x["Casos de Malaria US"]||0);

  new Chart(document.getElementById("grafico1"),{
    type:'bar',
    data:{labels:meses,datasets:[{label:'Consultas Externas',data:consultas,backgroundColor:'#1976d2'}]},
    options:{
      responsive:true,
      plugins:{legend:{display:false}},
      scales:{x:{grid:{color:'#555'},ticks:{color:'#fff'}},y:{beginAtZero:true,grid:{color:'#555'},ticks:{color:'#fff'}}},
      layout:{padding:10},
      backgroundColor:'#000'
    }
  });

  new Chart(document.getElementById("grafico2"),{
    type:'line',
    data:{labels:meses,datasets:[{label:'Casos de Malária',data:malaria,borderColor:'#0d47a1',tension:0.4,fill:false}]},
    options:{
      responsive:true,
      scales:{x:{grid:{color:'#555'},ticks:{color:'#fff'}},y:{grid:{color:'#555'},ticks:{color:'#fff'}}},
      plugins:{legend:{labels:{color:'#fff'}}},
      backgroundColor:'#000'
    }
  });

  const porUS={};
  d.forEach(x=>{const u=x["Unidade Sanitaria"];porUS[u]=(porUS[u]||0)+(+x["C.Externas (US)"]||0);});

  new Chart(document.getElementById("grafico3"),{
    type:'bar',
    data:{labels:Object.keys(porUS),datasets:[{label:'Consultas Externas por US',data:Object.values(porUS),backgroundColor:'#42a5f5'}]},
    options:{
      responsive:true,
      scales:{x:{grid:{color:'#555'},ticks:{color:'#fff'}},y:{beginAtZero:true,grid:{color:'#555'},ticks:{color:'#fff'}}},
      plugins:{legend:{labels:{color:'#fff'}}},
      backgroundColor:'#000'
    }
  });
}

carregarDados();
</script>
</body>
</html>
