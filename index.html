<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>📋 Inserção de Dados - Sector de Saúde</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 30px;
    }
    h2 {
      text-align: center;
      color: #2c3e50;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 900px;
      margin: auto;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }
    select, input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      margin-top: 20px;
      width: 100%;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #219150;
    }
    .msg {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>🩺 Formulário de Inserção de Dados nas US (21 a 24 de Cada Mes)</h2>
  <form id="form-dados">

    <!-- Campo período com mês e ano -->
    <label>Período (Mês e Ano):</label>
    <select id="Periodo" name="Periodo" required></select>

    <!-- Unidade Sanitária automática -->
    <label>Unidade Sanitária:</label>
    <select name="UnidadeSanitaria" required>
      <option value="" disabled selected>Selecione a Unidade Sanitária</option>
      <option value="CS de Mecunica">CS de Mecunica</option>
      <option value="CS de Mepuera">CS de Mepuera</option>
      <option value="CS de Metarica">CS de Metarica</option>
      <option value="CS de Muhemela">CS de Muhemela</option>
      <option value="CS de Nacumua">CS de Nacumua</option>
      <option value="CS de Namicunde">CS de Namicunde</option>
      <option value="CS de Niputa">CS de Niputa</option>
    </select>

    <label>C. Externas (US):</label>
    <input type="number" name="CExternasUS" required>

    <label>Casos de ITS:</label>
    <input type="number" name="CasosITS">

    <label>ATS:</label>
    <input type="number" name="ATS">

    <label>Início TARV:</label>
    <input type="number" name="InicioTARV">

    <label>Activos TARV:</label>
    <input type="number" name="ActivosTARV">

    <label>TB todas as Formas:</label>
    <input type="number" name="TBTodasFormas">

    <label>Casos de Malária:</label>
    <input type="number" name="CasosMalaria">

    <label>1ª CPN:</label>
    <input type="number" name="PrimeiraCPN">

    <label>CPN Coorte:</label>
    <input type="number" name="CPNCoorte">

    <label>Partos Institucionais:</label>
    <input type="number" name="PartosInstitucionais">

    <label>CPP:</label>
    <input type="number" name="CPP">

    <label>Depo:</label>
    <input type="number" name="Depo">

    <label>Pílula:</label>
    <input type="number" name="Pilula">

    <label>Implante:</label>
    <input type="number" name="Implante">

    <label>DIU:</label>
    <input type="number" name="DIU">

    <label>Rastreado:</label>
    <input type="number" name="Rastreado">

    <label>Positivos:</label>
    <input type="number" name="Positivos">

    <label>Demonstrações:</label>
    <input type="number" name="Demostracoes">

    <label>Total de 1ª CCR:</label>
    <input type="number" name="Total1aCCR">

    <label>Crianças Expostas HIV (CCR-9 meses):</label>
    <input type="number" name="CCR9Meses">

    <label>Crianças Expostas HIV (CCR-18 meses):</label>
    <input type="number" name="CCR18Meses">

    <label>Assinatura:</label>
    <input type="text" name="Assinatura" required>

    <button type="submit">💾 Guardar Dados</button>
  </form>

  <div class="msg" id="msg"></div>

  <script>
    // Lista de meses em português
    const meses = [
      "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
      "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
    ];

    const periodoSelect = document.getElementById("Periodo");
    const anoAtual = new Date().getFullYear();
    const mesAtual = new Date().getMonth();

    // Gera opções até o mês atual
    for (let m = 0; m <= mesAtual; m++) {
      const nomeMes = meses[m] + " " + anoAtual;
      const opt = document.createElement("option");
      opt.value = nomeMes;
      opt.textContent = nomeMes;
      periodoSelect.appendChild(opt);
    }

    // Define mês atual como padrão
    periodoSelect.value = `${meses[mesAtual]} ${anoAtual}`;

    const scriptURL = "https://script.google.com/macros/s/AKfycbxXvjY5Jy8SJgDFM2cbIrHaA7h0eJ1sicHIlUfMpMOpexoNYvaR3zpOMnIwh4O2jgZv/exec";

    document.getElementById("form-dados").addEventListener("submit", e => {
      e.preventDefault();
      const form = new FormData(e.target);

      fetch(scriptURL, { method: "POST", body: form })
        .then(res => {
          if (res.ok) {
            document.getElementById("msg").innerText = "✅ Dados enviados com sucesso!";
            e.target.reset();
            periodoSelect.value = `${meses[mesAtual]} ${anoAtual}`;
          } else {
            document.getElementById("msg").innerText = "❌ Erro ao enviar dados.";
          }
        })
        .catch(err => {
          document.getElementById("msg").innerText = "⚠️ Falha de conexão.";
          console.error(err);
        });
    });
  </script>
</body>
</html>
