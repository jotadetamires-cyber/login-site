<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Calculadora Interativa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
      background-color: #f7f7f7;
    }
    input {
      padding: 10px;
      margin: 5px;
      width: 150px;
    }
    .resultado {
      margin-top: 20px;
      padding: 15px;
      background-color: #fff;
      border-radius: 5px;
      box-shadow: 0 0 5px #ccc;
    }
    h2 {
      color: #004080;
    }
  </style>
</head>
<body>

 

  <script>
    function calcular() {
      const n1 = parseFloat(document.getElementById('num1').value);
      const n2 = parseFloat(document.getElementById('num2').value);

      if (isNaN(n1) || isNaN(n2)) {
        document.getElementById('resultado').innerHTML = "Insira dois números válidos.";
        return;
      }

      const soma = n1 + n2;
      const media = (n1 + n2) / 2;
      const raiz1 = Math.sqrt(n1);
      const raiz2 = Math.sqrt(n2);

      document.getElementById('resultado').innerHTML = `
        <strong>Soma:</strong> ${soma} <br>
        <strong>Média:</strong> ${media} <br>
        <strong>Raiz Quadrada do Número 1:</strong> ${raiz1.toFixed(2)} <br>
        <strong>Raiz Quadrada do Número 2:</strong> ${raiz2.toFixed(2)}
      `;
    }
  </script>

</body>
</html>
