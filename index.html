<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Relatório — Avaliação dda informacao</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: Inter, Arial, sans-serif; margin: 20px; background:#f6f8fa; color:#111; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:8px; }
    h1 { margin:0; font-size:20px; }
    .grid { display:grid; grid-template-columns: 1fr 420px; gap:20px; }
    .card { background:#fff; border-radius:10px; padding:14px; box-shadow:0 6px 18px rgba(12,20,40,0.06); position:relative; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:8px 10px; border-bottom:1px solid #f0eef6; text-align:left; vertical-align:top; }
    th { background:#159e1c; font-weight:600; font-size:13px; }
    .small { font-size:12px; color:#555; }
    .charts { display:flex; flex-direction:column; gap:18px; max-height:78vh; overflow:auto; padding-right:6px; }
    canvas { width:100% !important; height:240px !important; }
    .controls { display:flex; gap:10px; margin-bottom:10px; align-items:center; flex-wrap:wrap; }
    .btn { background:#0077cc; color:#fff; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:13px; }
    .btn.secondary { background:#e6eef9; color:#034; }
    select { padding:6px 8px; font-size:13px; border-radius:6px; border:1px solid #ccc; }
    @media (max-width:980px){ .grid { grid-template-columns:1fr; } .charts { max-height:none; } }

    /* ===== Botão de menu DHIS2 (9 pontinhos) ===== */
    .menu-float {
      position:absolute;
      top:12px;
      right:14px;
    }
    .menu-btn {
      background:#0077cc;
      color:#fff;
      border:none;
      border-radius:8px;
      width:32px;
      height:32px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 3px 8px rgba(0,0,0,0.15);
    }
    .menu-btn .dots {
      display:grid;
      grid-template-columns:repeat(3,4px);
      grid-gap:3px;
    }
    .menu-btn .dots span {
      width:4px;
      height:4px;
      background:#fff;
      border-radius:50%;
      display:block;
    }

    .menu-popup {
      display:none;
      position:absolute;
      right:0;
      top:40px;
      background:#fff;
      border-radius:8px;
      box-shadow:0 4px 14px rgba(0,0,0,0.1);
      overflow:hidden;
      z-index:100;
      min-width:210px;
      animation: fadeIn 0.15s ease-out;
    }
    .menu-popup a {
      display:block;
      padding:10px 12px;
      text-decoration:none;
      color:#222;
      font-size:13px;
    }
    .menu-popup a:hover {
      background:#02914e;
    }
    @keyframes fadeIn {
      from {opacity:0; transform:translateY(-4px);}
      to {opacity:1; transform:translateY(0);}
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Relatório — Avaliação e Triangulação de Dados (Distrito de Metarica)</h1>
    <div class="small">Gráficos filtráveis por Unidade Sanitária</div>
  </div>
  <div class="small">Gerado: <strong id="ts"></strong></div>
</header>

<div class="grid">
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; position:relative;">
      <h3 style="margin:0">Tabela de Observações</h3>
      <div class="menu-float">
        <button class="menu-btn" id="menuToggle" title="Abrir menu">
          <div class="dots">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
        </button>
        <div class="menu-popup" id="menuPopup">
          <a href="https://drive.google.com/file/d/1tTL0l-D1f0Ca7yKIceK-DoYK5IwgZ_iK/view" target="_blank">Avaliação de Cobertura</a>
          <a href="http://127.0.0.1:3002/index.html?serverWindowId=ddf4b0b3-41c9-4864-8995-d63357164ed9" target="_blank">Avaliação de Evolução</a>
          <a href="file:///C:/Users/hp/Downloads/index%20(17).html" target="_blank">Tendência de Casos</a>
          <a href="#" target="_blank">Avaliação de Desempenho</a>
        </div>
      </div>
    </div>

    <div class="small" style="margin-bottom:8px">Área de Saúde — Programa — Assunto</div>
    <table id="obs-table">
      <thead>
        <tr><th>Área de Saúde</th><th>Programa</th><th>Assunto</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="controls">
      <label for="filterArea">Filtrar por Área de Saúde:</label>
      <select id="filterArea">
        <option value="all">Todas</option>
      </select>
      <button class="btn" id="showAll">Mostrar todos</button>
      <button class="btn secondary" id="hideAll">Ocultar</button>
    </div>
    <div class="charts" id="charts-container"></div>
  </div>
</div>

<script>
  document.getElementById('ts').textContent = new Date().toLocaleString('pt-PT');

  // ==== MENU FLUTUANTE (tipo DHIS2) ====
  const menuBtn = document.getElementById('menuToggle');
  const menuPopup = document.getElementById('menuPopup');
  menuBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    menuPopup.style.display = menuPopup.style.display === 'block' ? 'none' : 'block';
  });
  document.addEventListener('click', ()=>menuPopup.style.display='none');

  // ==== Dados ====
  const rawRows = [
    {area:'CS de Nacumua', programa:'Doenças Tropical Negligenciada', assunto:'Não Elaboração do Resumo de Mês de Outubro'},
    {area:'CS de Metarica', programa:'Nutrição', assunto:'Não Elaboração do Resumo de Mês de Outubro (CCD)'},
    {area:'(várias)', programa:'Enfermagem', assunto:'Não Elaboração do Resumo de Mês de Outubro (C.Externa)'},
    {area:'CS de Namicunde', programa:'ATS', assunto:'Discrepância de dados entre o resumo e o reportado no SIDIS-J (70/106)'},
    {area:'CS de Mecunica', programa:'Ficha de HIV', assunto:'O ponto focal deve coordenar com director do centro para armonizar os activos'},
    {area:'CS de Muhemela', programa:'Ficha de HIV', assunto:'O ponto focal deve coordenar com director do centro para armonizar os activos'},
    {area:'CS de Mepuera', programa:'ITS', assunto:'Discrepância de dados entre o resumo e o reportado no SIDIS-J (20/5)'},
    {area:'CS de Nacumua', programa:'PAV', assunto:'Discrepância de dados entre o resumo e o reportado no SIDIS-J (45/15) (ccv)'},
    {area:'CS de Muhemela', programa:'PAV', assunto:'Discrepância de dados entre o resumo e o reportado no SIDIS-J CCV assim como BCG'},
    {area:'Algumas US', programa:'PAV', assunto:'Devem inserir o número de Brigadas Moveis planificadas nos resumos mensais de VAT'},
    {area:'CS de Niputa', programa:'CPN', assunto:'Discrepância de dados no período de coorte (maio-49, Outubro-62)'},
    {area:'CS de Mepuera', programa:'CPN', assunto:'Discrepância de dados no período de coorte (maio-36, Outubro-32)'},
    {area:'CS de Mecunica', programa:'CPN', assunto:'O somatório entre positivos e negativos para sífilis é inferior ao total das CPN coorte'},
    {area:'CS de Muhemela', programa:'CPN', assunto:'Discrepância de dados entre o resumo e o reportado no SIDIS-J toda informação de CPN'},
    {area:'CS de Muhemela', programa:'Maternidade', assunto:'Discrepância de dados entre o resumo e o reportado no SIDIS-J (32/22)'},
    {area:'CS de Niputa', programa:'Maternidade', assunto:'Fazer a revisão do resumo: dos 20 nados vivos não tiveram pele a pele com a mãe e não foram amamentadas'},
    {area:'Cs de Namicunde', programa:'Maternidade', assunto:'Dos 26 partos atendidos nenhum teve acompanhante durante o trabalho de parto'},
    {area:'Cs de Nacumua', programa:'Pós-parto', assunto:'Discrepância de dados no período de coorte (Agosto-35, Outubro-59)'},
    {area:'CS de Niputa', programa:'Pós-parto', assunto:'Discrepância de dados no período de coorte (Agosto-20, Outubro-17)'},
    {area:'CS de Metarica', programa:'Pós-parto', assunto:'As duas crianças nascidas fora da maternidade não foram registadas na consulta pós-parto (86 + 2 = 88)'},
    {area:'CS de Mecunica', programa:'CCR', assunto:'Notificou uma criança exposta a HIV; nenhuma mãe HIV positiva foi identificada na maternidade'},
    {area:'CS de Mepuera', programa:'PF', assunto:'Deve rever, as 96 mulheres que entraram com estado desconhecido para HIV não foram testadas (linha 29)'},
    {area:'CS de Muhemela', programa:'BCG/Nados Vivos', assunto:'Diferenca entre criancas vacinadas com BCG e nados vivos (20/32)'},
    {area:'CS de Metarica', programa:'BCG/Nados Vivos', assunto:'Diferenca entre criancas vacinadas com BCG e nados vivos (114/87)'},
    {area:'Cs de Namicunde', programa:'BCG/Nados Vivos', assunto:'Diferenca entre criancas vacinadas com BCG e nados vivos (24/26)'},
    {area:'CS de Niputa', programa:'BCG/Nados Vivos', assunto:'Diferenca entre criancas vacinadas com BCG e nados vivos (26/20)'},
    {area:'CS de Mecunica', programa:'BCG/Nados Vivos', assunto:'Diferenca entre criancas vacinadas com BCG e nados vivos (51/37)'},
    {area:'CS de Nacuma', programa:'BCG/Nados Vivos', assunto:'Diferenca entre criancas vacinadas com BCG e nados vivos (45/40)'},
    {area:'CS de Mepuera', programa:'BCG/Nados Vivos', assunto:'Diferenca entre criancas vacinadas com BCG e nados vivos28/32'}
  ];

  // === Tabela ===
  const tbody=document.getElementById('table-body');
  rawRows.forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${r.area}</td><td>${r.programa}</td><td>${r.assunto}</td>`;
    tbody.appendChild(tr);
  });

  // === Extração de dados ===
  function extractPairValues(text){
    const m=text.match(/(\d+)\s*\/\s*(\d+)/);
    if(m) return {a:+m[1],b:+m[2]};
    return null;
  }
  function extractMonthPairs(text){
    const re=/([A-Za-zçãõÉéíÓóúÂâÊêÛû]+)[\-\s]*(\d+)/g;
    const mesesPT=['janeiro','fevereiro','março','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    let list=[],mm;
    while((mm=re.exec(text))!==null){
      if(mesesPT.includes(mm[1].toLowerCase())) list.push({month:mm[1],value:+mm[2]});
    }
    return list.length>=2?list:null;
  }

  const chartsData=[];
  rawRows.forEach(r=>{
    const text=r.assunto;
    const p=extractPairValues(text);
    if(p){
      chartsData.push({area:r.area,labels:['Resumo','SIDIS-J'],values:[p.a,p.b],title:`${r.programa} — ${r.area}`});
      return;
    }
    const m=extractMonthPairs(text);
    if(m){
      chartsData.push({area:r.area,labels:m.map(x=>x.month),values:m.map(x=>x.value),title:`${r.programa} — ${r.area}`});
      return;
    }
  });

  // === Popular filtro ===
  const select=document.getElementById('filterArea');
  const areas=[...new Set(rawRows.map(r=>r.area))].sort();
  areas.forEach(a=>{
    const opt=document.createElement('option');
    opt.value=a; opt.textContent=a;
    select.appendChild(opt);
  });

  // === Gráficos ===
  const container=document.getElementById('charts-container');
  function renderCharts(filter="all"){
    container.innerHTML="";
    chartsData.forEach(cd=>{
      if(filter!=="all" && cd.area!==filter) return;
      const card=document.createElement('div');
      card.style.background="#fff";
      card.style.padding="10px";
      card.style.borderRadius="8px";
      card.style.boxShadow="0 4px 10px rgba(0,0,0,0.05)";
      const title=document.createElement('div');
      title.innerHTML=`<strong>${cd.title}</strong>`;
      card.appendChild(title);
      const canvas=document.createElement('canvas');
      card.appendChild(canvas);
      container.appendChild(card);

      new Chart(canvas.getContext('2d'),{
        type:'bar',
        data:{labels:cd.labels,datasets:[{label:'Valores',data:cd.values,borderWidth:1}]},
        options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{precision:0}}}}
      });
    });
    if(container.innerHTML==="") container.innerHTML="<div class='small'>Nenhum gráfico disponível para esta área.</div>";
  }
  renderCharts();

  // === Eventos ===
  select.addEventListener('change',()=>renderCharts(select.value));
  document.getElementById('showAll').onclick=()=>Array.from(container.children).forEach(c=>c.style.display='block');
  document.getElementById('hideAll').onclick=()=>Array.from(container.children).forEach(c=>c.style.display='none');
</script>

</body>
</html>
