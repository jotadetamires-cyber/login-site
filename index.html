<!DOCTYPE html>
<html lang="pt">
<head><script type="text/javascript" src="/___vscode_livepreview_injected_script"></script>
<meta charset="UTF-8">
<title>Tendência de Casos — Indicadores de Saúde</title>

<!-- SheetJS para Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- jsPDF para PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  body { font-family: Arial, sans-serif; background: #f4f7fb; padding: 20px; }
  h2 { text-align: center; color: #123; margin-bottom: 20px; }
  .controls {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 10px; margin-bottom: 25px;
  }
  select, button { padding: 6px 10px; font-size: 14px; }
  .grafico {
    width: 90%; max-width: 900px; background: #fff; border-radius: 8px;
    box-shadow: 0 0 5px rgba(0,0,0,0.1); margin: 25px auto; padding: 15px;
  }
  canvas { width: 100%; height: 320px; }
  .titulo-indicador { text-align: center; font-weight: bold; margin-bottom: 6px; color: #222; }
  .legenda-personalizada { text-align: center; font-size: 14px; margin-bottom: 10px; }
  .legenda-item { display: inline-block; margin: 0 8px; }
  .legenda-cor {
    display: inline-block; width: 14px; height: 14px; border-radius: 3px;
    margin-right: 5px; vertical-align: middle;
  }
  </style>
</head>
<body>

<h2>Tendência de Casos — Seleciona o ano ( o mes de Setembro coresponde a Outubro)</h2>

 </button>

<div class="controls">
  <label>Unidade Sanitária:</label>
  <select id="areaSelect"><option value="">--Todas--</option></select>

  <label>Ano:</label>
  <select id="anoSelect"><option value="">--Todos--</option></select>

  <label>Mês:</label>
  <select id="mesSelect">
    <option value="">--Todos--</option>
    <option value="01">Janeiro</option><option value="02">Fevereiro</option>
    <option value="03">Março</option><option value="04">Abril</option>
    <option value="05">Maio</option><option value="06">Junho</option>
    <option value="07">Julho</option><option value="08">Agosto</option>
    <option value="09">Setembro</option><option value="10">Outubro</option>
    <option value="11">Novembro</option><option value="12">Dezembro</option>
  </select>

  <label>Tipo de Gráfico:</label>
  <select id="tipoGrafico">
    <option value="line">Linha</option>
    <option value="bar">Barra</option>
    <option value="radar">Radar</option>
    <option value="doughnut">Rosca</option>
  </select>

  <button id="exportExcel">Exportar Excel</button>
  <button id="exportPDF">Exportar PDF</button>
</div>

<div id="containerGraficos"></div>

<script>
const URL_APP = 'https://script.google.com/macros/s/AKfycbzIdQoE9cSvOdLE5t8pJJs4usKlDI7zqrk8I2tD86vrKRafa0ZQt6RAizRw7WD2wXkl/exec';
let dados = [], indicadores = [], charts = [];

const cores = [
  "#1976d2", "#388e3c", "#f57c00", "#7b1fa2", "#0288d1",
  "#c2185b", "#00796b", "#512da8", "#e64a19", "#303f9f"
];

async function carregarDados() {
  try {
    const res = await fetch(URL_APP);
    const json = await res.json();
    dados = json.dados || [];
    if (!dados.length) return alert("Nenhum dado encontrado na planilha.");
    indicadores = Object.keys(dados[0]).filter(k => k !== 'Periodo' && k !== 'Unidade Sanitaria');
    preencherFiltros();
    gerarGraficos();
  } catch (err) {
    alert("Erro ao carregar dados. Verifique a conexão ou URL.");
  }
}

function preencherFiltros() {
  const areaSel = document.getElementById("areaSelect");
  const anoSel = document.getElementById("anoSelect");

  const unidades = [...new Set(dados.map(d => d['Unidade Sanitaria']))].filter(Boolean).sort();
  unidades.forEach(u => areaSel.appendChild(new Option(u, u)));

  const anos = [...new Set(dados.map(d => {
    const m = d.Periodo.match(/\b(20\d{2})\b/);
    return m ? m[1] : null;
  }))].filter(Boolean).sort();
  anos.forEach(a => anoSel.appendChild(new Option(a, a)));

  areaSel.addEventListener("change", gerarGraficos);
  anoSel.addEventListener("change", gerarGraficos);
  document.getElementById("mesSelect").addEventListener("change", gerarGraficos);
  document.getElementById("tipoGrafico").addEventListener("change", gerarGraficos);
}

function gerarGraficos() {
  const area = document.getElementById("areaSelect").value;
  const anoAtual = document.getElementById("anoSelect").value;
  const mes = document.getElementById("mesSelect").value;
  const tipo = document.getElementById("tipoGrafico").value;
  const container = document.getElementById("containerGraficos");
  container.innerHTML = "";
  charts = [];

  indicadores.forEach((indicador, idx) => {
    let registros = area ? dados.filter(d => d['Unidade Sanitaria'] === area) : dados;
    const corBase = cores[idx % cores.length];
    const anoAnterior = anoAtual ? String(Number(anoAtual) - 1) : null;

    const filtroPeriodo = (r, ano, mes) => {
      const p = r.Periodo;
      const temAno = ano ? p.includes(ano) : true;
      const temMes = mes ? p.includes(`-${mes}`) || p.includes(`/${mes}`) : true;
      return temAno && temMes;
    };

    const dadosAnoAtual = registros.filter(r => filtroPeriodo(r, anoAtual, mes));
    const dadosAnoAnterior = registros.filter(r => filtroPeriodo(r, anoAnterior, mes));

    const agrupar = lista => {
      const g = {};
      lista.forEach(r => {
        const periodo = normalizarPeriodo(r.Periodo);
        const valor = parseFloat(r[indicador]) || 0;
        if (!g[periodo]) g[periodo] = 0;
        g[periodo] += valor;
      });
      return g;
    };

    const agrupadoAtual = agrupar(dadosAnoAtual);
    const agrupadoAnterior = agrupar(dadosAnoAnterior);

    const todosMeses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
      "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

    const mesesPresentes = mes
      ? [mesNome(mes)]
      : todosMeses.filter(m => 
          Object.keys(agrupadoAtual).some(p => p.startsWith(m)) ||
          Object.keys(agrupadoAnterior).some(p => p.startsWith(m))
        );

    const valoresAtual = mesesPresentes.map(m => {
      const key = Object.keys(agrupadoAtual).find(k => k.startsWith(m)) || "";
      return agrupadoAtual[key] || 0;
    });

    const valoresAnterior = mesesPresentes.map(m => {
      const key = Object.keys(agrupadoAnterior).find(k => k.startsWith(m)) || "";
      return agrupadoAnterior[key] || 0;
    });

    const div = document.createElement("div");
    div.className = "grafico";
    div.innerHTML = `
      <div class="titulo-indicador">${indicador}</div>
      <div class="legenda-personalizada">
        <span class="legenda-item"><span class="legenda-cor" style="background-color:${corBase}"></span>${anoAtual || "Ano atual"}</span>
        <span class="legenda-item"><span class="legenda-cor" style="background-color:${corBase}80"></span>${anoAnterior || "Ano anterior"}</span>
      </div>
      <canvas></canvas>
    `;
    container.appendChild(div);

    const ctx = div.querySelector("canvas").getContext("2d");

    const chart = new Chart(ctx, {
      type: tipo,
      data: {
        labels: mesesPresentes,
        datasets: [
          {
            label: anoAnterior,
            data: valoresAnterior,
            borderColor: `${corBase}80`,
            backgroundColor: tipo === "line" ? `${corBase}30` : `${corBase}80`,
            fill: tipo === "line" || tipo === "radar",
            tension: 0.3,
            pointRadius: 4
          },
          {
            label: anoAtual,
            data: valoresAtual,
            borderColor: corBase,
            backgroundColor: tipo === "line" ? `${corBase}40` : corBase,
            fill: tipo === "line" || tipo === "radar",
            tension: 0.3,
            pointRadius: 4
          }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: tipo !== "radar" && tipo !== "doughnut" ? {
          x: { title: { display: true, text: "Mês" } },
          y: { title: { display: true, text: "Casos" }, beginAtZero: true }
        } : {}
      }
    });
    charts.push(chart);
  });
}

function mesNome(num) {
  const meses = { "01": "Janeiro","02":"Fevereiro","03":"Março","04":"Abril","05":"Maio","06":"Junho",
                  "07":"Julho","08":"Agosto","09":"Setembro","10":"Outubro","11":"Novembro","12":"Dezembro" };
  return meses[num] || "";
}

function normalizarPeriodo(p) {
  const m = p.match(/(20\d{2})[-/](\d{1,2})/);
  if (m) return `${mesNome(m[2].padStart(2,"0"))} ${m[1]}`;
  return p;
}

function exportExcel() {
  if (!dados.length) return alert("Sem dados para exportar.");
  const ws = XLSX.utils.json_to_sheet(dados);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Dados");
  XLSX.writeFile(wb, "Tendencia_Indicadores.xlsx");
}

function exportPDF() {
  if (!charts.length) return alert("Gere os gráficos primeiro.");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("landscape");
  doc.setFontSize(14);
  doc.text("Tendência de Casos — Indicadores de Saúde", 20, 20);
  let y = 40;
  charts.forEach((chart, i) => {
    const img = chart.toBase64Image();
    doc.addImage(img, "PNG", 20, y, 250, 100);
    doc.text(indicadores[i], 20, y - 3);
    y += 110;
    if (y > 180 && i < charts.length - 1) { doc.addPage(); y = 30; }
  });
  doc.save("Tendencia_Indicadores.pdf");
}

document.getElementById("exportExcel").addEventListener("click", exportExcel);
document.getElementById("exportPDF").addEventListener("click", exportPDF);

carregarDados();
</script>
</body>
</html>
