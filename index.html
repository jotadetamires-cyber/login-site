<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pagamento Cotas (e-Mola) - Demo</title>
</head>
<body>
  <h2>Pagamento de Cotas via e-Mola (demo)</h2>
  <form id="payForm">
    Telefone (84xxxxxxx): <input id="phone" name="phone" required /><br/>
    Valor (MZN): <input id="amount" name="amount" type="number" step="0.01" required /><br/>
    <button type="submit">Pagar</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('payForm');
    const resEl = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('phone').value;
      const amount = document.getElementById('amount').value;
      resEl.innerText = 'Solicitando pagamento...';

      const r = await fetch('/create-payment', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ phone, amount, description: 'Cotas Jemx School' })
      });
      const data = await r.json();
      if (data.merchantTxId) {
        resEl.innerHTML = 'Pedido enviado. Aguardando confirmação...<br/>ID: ' + data.merchantTxId;
        // Poll (simples) a cada 3s até confirmar (em produção prefira websockets ou esperar webhook)
        const id = data.merchantTxId;
        const interval = setInterval( async () => {
          const s = await fetch(`/payment-status/${id}`);
          const js = await s.json();
          resEl.innerHTML = 'Status: ' + js.status + '<br/>' + JSON.stringify(js.providerResponse || js.providerWebhook || {}, null, 2);
          if (js.status === 'CONFIRMED' || js.status === 'FAILED') {
            clearInterval(interval);
          }
        }, 3000);
      } else {
        resEl.innerText = 'Erro: ' + (data.error || JSON.stringify(data));
      }
    });
  </script>
</body>
</html>
