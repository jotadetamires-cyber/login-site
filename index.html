<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Controle e Monitoria de Saúde Distrital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SheetJS e jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

  <style>
    body { font-family: 'Arial', sans-serif; }
    .active-tab { border-left: 4px solid #1E40AF; font-weight: 700; background-color: #E0E7FF; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    th { background-color: #004080; color: white; }
    .total td { background-color: #cce5ff; font-weight: bold; }
  </style>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- Cabeçalho -->
  <header class="bg-blue-700 text-white p-4">
    <h1 class="text-2xl font-bold">Sistema Distrital de Saúde - Metarica</h1>
  </header>

  <div class="flex h-screen">

    <!-- Menu lateral -->
    <aside class="bg-white w-64 shadow-md p-4 flex flex-col">
      <h2 class="text-lg font-semibold mb-3">📁 Menu</h2>
      <button class="tab-btn text-left p-2 rounded hover:bg-blue-100" data-tab="insercao">📝 Inserção de Dados</button>
      <button class="tab-btn text-left p-2 rounded hover:bg-blue-100" data-tab="visualizacao">📊 Visualização de Dados</button>
      <button class="tab-btn text-left p-2 rounded hover:bg-blue-100" data-tab="analise">📈 Análise de Dados</button>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="flex-1 p-6 overflow-auto">

      <!-- Aba Inserção -->
      <section id="insercao" class="tab-content hidden">
        <h2 class="text-xl font-bold mb-4 text-center">🩺 Inserção de Dados nas Unidades Sanitárias</h2>
        <form id="form-dados" class="bg-white p-6 rounded-lg shadow-md max-w-2xl mx-auto">
          <label>Período:</label>
          <select id="Periodo" name="Periodo" required></select>

          <label>Unidade Sanitária:</label>
          <select name="UnidadeSanitaria" required>
            <option value="">Selecione...</option>
            <option value="CS de Metarica">CS de Metarica</option>
            <option value="CS de Mecunica">CS de Mecunica</option>
            <option value="CS de Mepuera">CS de Mepuera</option>
            <option value="CS de Muhemela">CS de Muhemela</option>
            <option value="CS de Nacumua">CS de Nacumua</option>
            <option value="CS de Namicunde">CS de Namicunde</option>
            <option value="CS de Niputa">CS de Niputa</option>
          </select>

          <label>C. Externas (US):</label>
          <input type="number" name="CExternasUS" class="border rounded p-1 w-full">

          <label>Casos de Malária (US):</label>
          <input type="number" name="CasosMalariaUS" class="border rounded p-1 w-full">

          <label>Assinatura:</label>
          <input type="text" name="Assinatura" class="border rounded p-1 w-full" required>

          <button type="submit" class="bg-green-600 hover:bg-green-700 text-white mt-4 px-4 py-2 rounded w-full">
            💾 Guardar Dados
          </button>
        </form>

        <p id="msg" class="text-center mt-4 font-bold"></p>

        <script>
          const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
          const periodoSelect = document.getElementById("Periodo");
          const anoAtual = new Date().getFullYear();
          const mesAtual = new Date().getMonth();
          for (let i = 0; i <= mesAtual; i++) {
            const opt = document.createElement("option");
            opt.value = `${meses[i]} ${anoAtual}`;
            opt.textContent = `${meses[i]} ${anoAtual}`;
            periodoSelect.appendChild(opt);
          }
          periodoSelect.value = `${meses[mesAtual]} ${anoAtual}`;

          const scriptURL = "https://script.google.com/macros/s/AKfycbzuIGpHzccD8ilHZbGav1ZJ7FkuktCxkhviNr6784ch1dVTY-cOBTrFxCeMx2vBIkk/exec";
          document.getElementById("form-dados").addEventListener("submit", e => {
            e.preventDefault();
            const form = new FormData(e.target);
            form.append("Data", new Date().toLocaleString('pt-PT'));
            fetch(scriptURL, { method: "POST", body: form })
              .then(r => {
                document.getElementById("msg").textContent = r.ok ? "✅ Dados enviados com sucesso!" : "❌ Erro ao enviar dados.";
                if (r.ok) e.target.reset();
              })
              .catch(() => document.getElementById("msg").textContent = "⚠️ Falha de conexão.");
          });
        </script>
      </section>

      <!-- Aba Visualização (Relatório SDSMAS) -->
      <section id="visualizacao" class="tab-content hidden bg-white p-6 rounded shadow-md">
        <h2 class="text-xl font-bold mb-3 text-center text-blue-700">📋 Relatório SDSMAS</h2>

        <!-- Aqui começa o conteúdo do seu código SDSMAS -->
        <div id="relatorioSDSMAS"></div>

        <script>
          // Injeta o HTML completo do relatório SDSMAS na aba
          document.getElementById("relatorioSDSMAS").innerHTML = `
            ${String.raw`
              ${`<style>
                body { background: #fff !important; }
              </style>`}
            `}
          `; // será substituído dinamicamente pelo conteúdo que você colou
        </script>
      </section>

      <!-- Aba Análise (Evolução Anual) -->
      <section id="analise" class="tab-content hidden bg-white p-6 rounded shadow-md">
        <h2 class="text-xl font-bold mb-4 text-center">📈 Análise de Indicadores - Evolução Anual</h2>
        <div id="analiseConteudo">
          <!-- Aqui entra o código do sistema de evolução anual -->
        </div>
      </section>

    </main>
  </div>

  <script>
    // Alternância de abas
    const tabs = document.querySelectorAll('.tab-btn');
    const sections = document.querySelectorAll('.tab-content');
    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active-tab'));
        btn.classList.add('active-tab');
        sections.forEach(sec => sec.classList.add('hidden'));
        document.getElementById(btn.dataset.tab).classList.remove('hidden');
      });
    });
    tabs[0].click();
  </script>
</body>
</html>
