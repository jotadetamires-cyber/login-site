<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Controle e Monitoria de Saúde Distrital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Roboto', sans-serif; }
    .active-tab { border-bottom: 3px solid #1D4ED8; font-weight: 700; }
    .tab-content { max-height: calc(100vh - 150px); overflow: auto; }
    /* Inserção de Dados */
    .form-container { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
    .form-container label { font-weight: bold; display: block; margin-top: 10px; }
    .form-container select, .form-container input, .form-container textarea { width: 100%; padding: 8px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    .form-container button { background: #27ae60; color: white; border: none; padding: 12px 20px; border-radius: 8px; margin-top: 20px; width: 100%; cursor: pointer; font-size: 16px; }
    .form-container button:hover { background: #219150; }
    .msg { text-align: center; margin-top: 20px; font-weight: bold; }
    /* Visualização de Dados */
    #indicadoresBox { background: #f0f8ff; padding: 10px; margin: 10px 0; border: 1px solid #004080; border-radius: 8px; }
    #indicadoresBox label { display: inline-block; width: 200px; margin-bottom: 5px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 6px; text-align: center; border: 1px solid #ddd; }
    thead th { background-color: #004080; color: #ffffff; }
    .total td { background-color: #cce5ff; font-weight: bold; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-blue-700 text-white p-4 shadow-md">
    <h1 class="text-2xl font-bold">Sistema de Controle e Monitoria de Saúde - Distrito</h1>
  </header>

  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="bg-white w-64 shadow-md p-4 flex flex-col">
      <h2 class="text-xl font-semibold mb-4">Menu Principal</h2>
      <nav class="flex flex-col space-y-2">
        <button class="tab-btn p-2 text-left rounded hover:bg-blue-100" data-tab="insercao">Inserção de Dados</button>
        <button class="tab-btn p-2 text-left rounded hover:bg-blue-100" data-tab="visualizacao">Visualização de Dados</button>
        <button class="tab-btn p-2 text-left rounded hover:bg-blue-100" data-tab="analise">Análise de Dados</button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 overflow-auto">

      <!-- Inserção de Dados -->
      <section id="insercao" class="tab-content hidden">
        <h2 class="text-xl font-bold mb-4 text-center">🩺 Formulário de Inserção de Dados nas US (21 a 24 de Cada Mês)</h2>
        <form id="form-dados" class="form-container">
          <label>Período (Mês e Ano):</label>
          <select id="PeriodoInsercao" name="Periodo" required></select>
          <label>Unidade Sanitária:</label>
          <select name="UnidadeSanitaria" required>
            <option value="" disabled selected>Selecione a Unidade Sanitária</option>
            <option value="CS de Mecunica">CS de Mecunica</option>
            <option value="CS de Mepuera">CS de Mepuera</option>
            <option value="CS de Metarica">CS de Metarica</option>
            <option value="CS de Muhemela">CS de Muhemela</option>
            <option value="CS de Nacumua">CS de Nacumua</option>
            <option value="CS de Namicunde">CS de Namicunde</option>
            <option value="CS de Niputa">CS de Niputa</option>
          </select>
          <!-- Campos numéricos omitidos para brevidade -->
          <label>Assinatura:</label>
          <input type="text" name="Assinatura" required>
          <button type="submit">💾 Guardar Dados</button>
        </form>
        <div class="msg" id="msgInsercao"></div>
      </section>

      <!-- Visualização de Dados -->
      <section id="visualizacao" class="tab-content hidden bg-white p-6 rounded shadow-md">
        <h2 class="text-xl font-bold mb-4">Relatório SDSMAS</h2>
        <label>Selecionar Período:</label>
        <select id="PeriodoVisualizacao"></select>
        <label>Selecionar Agregação:</label>
        <select id="AgregacaoVisualizacao">
          <option value="mensal">Mensal</option>
          <option value="trimestral">Trimestral</option>
          <option value="semestral">Semestral</option>
          <option value="nonestral">Nonestral</option>
          <option value="anual">Anual</option>
        </select>
        <button id="baixarExcel">📥 Baixar Excel</button>
        <button id="baixarPDF">📄 Baixar PDF</button>
        <div id="indicadoresBox"><strong>Selecione os Indicadores para o PDF:</strong><br></div>
        <table id="tabela">
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </section>

      <!-- Análise de Dados -->
      <section id="analise" class="tab-content hidden bg-white p-6 rounded shadow-md">
        <h2 class="text-xl font-bold mb-4">Análise de Dados</h2>
        <p>Aqui você pode incorporar gráficos interativos, dashboards e cálculos de percentagens.</p>
        <canvas id="grafico-analise" width="600" height="400"></canvas>
      </section>

    </main>
  </div>

  <!-- Bibliotecas -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Script Geral -->
  <script>
    document.addEventListener('DOMContentLoaded',()=>{

      // Menu Tabs
      const tabs=document.querySelectorAll('.tab-btn');
      const tabContents=document.querySelectorAll('.tab-content');
      tabs.forEach(tab=>{
        tab.addEventListener('click',()=>{
          tabContents.forEach(c=>c.classList.add('hidden'));
          document.getElementById(tab.dataset.tab).classList.remove('hidden');
          tabs.forEach(t=>t.classList.remove('active-tab'));
          tab.classList.add('active-tab');
        });
      });
      tabs[0].click();

      // --- Inserção de Dados ---
      const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
      const periodoInsercao=document.getElementById("PeriodoInsercao");
      const anoAtual=new Date().getFullYear();
      const mesAtual=new Date().getMonth();
      for(let m=0;m<=mesAtual;m++){
        const opt=document.createElement("option");
        opt.value=meses[m]+" "+anoAtual;
        opt.textContent=meses[m]+" "+anoAtual;
        periodoInsercao.appendChild(opt);
      }
      periodoInsercao.value=`${meses[mesAtual]} ${anoAtual}`;
      const formDados=document.getElementById("form-dados");
      formDados.addEventListener("submit",e=>{
        e.preventDefault();
        const form=new FormData(e.target);
        const agora=new Date();
        form.append("Data",agora.toLocaleDateString('pt-PT')+" "+agora.toLocaleTimeString('pt-PT'));
        fetch("https://script.google.com/macros/s/AKfycbzuIGpHzccD8ilHZbGav1ZJ7FkuktCxkhviNr6784ch1dVTY-cOBTrFxCeMx2vBIkk/exec",{method:"POST",body:form})
        .then(res=>res.ok?document.getElementById("msgInsercao").innerText="✅ Dados enviados com sucesso!":document.getElementById("msgInsercao").innerText="❌ Erro ao enviar dados.")
        .catch(err=>{document.getElementById("msgInsercao").innerText="⚠️ Falha de conexão.";console.error(err);});
      });

      // --- Visualização de Dados ---
      const periodoVisual=document.getElementById("PeriodoVisualizacao");
      const agregacaoVisual=document.getElementById("AgregacaoVisualizacao");
      const tbody=document.getElementById("tbody");
      const thead=document.getElementById("thead");
      const indicadoresBox=document.getElementById("indicadoresBox");
      const colunasNumericas=["C.Externas (US)","C.Externas (APS)","Casos de ITS","ATS","Inicio TARV","Activos TARV","TB todas as Formas","Bacteriologicamente Confirmado","Casos de Malaria US","1a CPN","CPN<12 semanas","Redes Distribuida na 1a CPN","CPN Coorte","Partos Institucionais","CPP","Depo","Pilula","Implante","DIU","Rastreiado","Positivos","Demostracoes","1a CPF","BCG","CCV"];
      let dadosPlanilha=[];

      async function carregarDados(){
        try{
          const res=await fetch("https://script.google.com/macros/s/AKfycbxFKOVfeFEzGAyY8NSfmzJJJro7w5r0bBZ3KF2Taa49Dz7jV9k3OWUxqb24xpprTh0/exec");
          const dados=await res.json();
          dadosPlanilha=dados;
          atualizarPeriodos();
        }catch(e){console.error("Erro ao carregar dados:",e);}
      }

      function formatarPeriodo(d,tipo){
        const data=new Date(d.Periodo);
        if(tipo==="mensal") return !isNaN(data)?`${meses[data.getMonth()]} ${data.getFullYear()}`:d.Periodo;
        switch(tipo){
          case "trimestral": return !isNaN(data)?`${Math.floor(data.getMonth()/3)+1}º Trimestre ${data.Periodo.split(' ')[1]}`:d.Periodo;
          case "semestral": return !isNaN(data)?`${Math.floor(data.getMonth()/6)+1}º Semestre ${data.Periodo.split(' ')[1]}`:d.Periodo;
          case "nonestral": return !isNaN(data)?`${Math.floor(data.getMonth()/9)+1}º Nonestral ${data.Periodo.split(' ')[1]}`:d.Periodo;
          case "anual": return !isNaN(data)?`${data.getFullYear()}`:d.Periodo;
          default: return d.Periodo;
        }
      }

      function atualizarPeriodos(){
        const tipo=agregacaoVisual.value;
        const periodosSet=new Set(dadosPlanilha.map(d=>formatarPeriodo(d,tipo)));
        periodoVisual.innerHTML=Array.from(periodosSet).map(p=>`<option value="${p}">${p}</option>`).join("");
        if(periodosSet.size>0) filtrarExibir(periodoVisual.value);
      }

      function filtrarExibir(periodoSelecionado){
        const tipo=agregacaoVisual.value;
        let dadosFiltrados=dadosPlanilha.map(d=>({...d,_PeriodoFormatado:formatarPeriodo(d,tipo)})).filter(d=>d._PeriodoFormatado===periodoSelecionado);
        if(tipo!=="mensal"){
          const agregados={};
          dadosFiltrados.forEach(d=>{
            const chave=d["Unidade Sanitaria"];
            if(!agregados[chave]) agregados[chave]={...d};
            else colunasNumericas.forEach(c=>agregados[chave][c]+=(parseFloat(d[c])||0));
          });
          dadosFiltrados=Object.values(agregados);
        }
        if(dadosFiltrados.length===0) return;
        const headers=Object.keys(dadosFiltrados[0]).filter(h=>h!=="_PeriodoFormatado");
        thead.innerHTML="<tr>"+headers.map(h=>`<th>${h}</th>`).join("")+"</tr>";
        tbody.innerHTML=dadosFiltrados.map(row=>"<tr>"+headers.map(h=>{let v=row[h];if(h.toLowerCase().includes("periodo")&&row._PeriodoFormatado) v=row._PeriodoFormatado;return `<td>${v}</td>`}).join("")+"</tr>").join("");
        adicionarTotal(headers,dadosFiltrados);
        gerarChecklistIndicadores(headers);
      }

      function adicionarTotal(headers,dadosFiltrados){
        let totalRow="<tr class='total'>";
        headers.forEach((h,i)=>{
          if(i===0) totalRow+="<td>TOTAL</td>";
          else if(colunasNumericas.includes(h)){
            totalRow+=`<td>${dadosFiltrados.reduce((acc,d)=>acc+(parseFloat(d[h])||0),0)}</td>`;
          }else totalRow+="<td></td>";
        });
        totalRow+="</tr>";
        tbody.innerHTML+=totalRow;
      }

      function gerarChecklistIndicadores(headers){
        indicadoresBox.innerHTML="<strong>Selecione os Indicadores para o PDF:</strong><br>"+headers.map(h=>`<label><input type="checkbox" class="indicadorCheck" value="${h}" checked> ${h}</label>`).join("");
      }

      agregacaoVisual.addEventListener("change",atualizarPeriodos);
      periodoVisual.addEventListener("change",e=>filtrarExibir(e.target.value));

      document.getElementById("baixarExcel").addEventListener("click",()=>{
        const wb=XLSX.utils.table_to_book(document.getElementById("tabela"),{sheet:"Dados"});
        XLSX.writeFile(wb,"dados_planilha.xlsx");
      });

      document.getElementById("baixarPDF").addEventListener("click",()=>{
        const { jsPDF } = window.jspdf;
        const doc=new jsPDF({orientation:"landscape"});
        const periodo=periodoVisual.value||"";
        const largura=doc.internal.pageSize.getWidth();
        doc.setFontSize(12);
        ["República de Moçambique","Governo do Distrito de Metarica","Sector do Núcleo de Estatística Distrital",`Relatório de Dados – ${periodo}`].forEach((linha,y=15,i)=>{const w=doc.getTextWidth(linha);doc.text(linha,(largura-w)/2,15+i*7);});
        const selecionados=Array.from(document.querySelectorAll(".indicadorCheck:checked")).map(c=>c.value);
        if(selecionados.length===0){alert("Selecione pelo menos um indicador"); return;}
        const tabela=document.getElementById("tabela");
        const headers=Array.from(tabela.querySelectorAll("thead th")).map(th=>th.textContent);
        const linhas=Array.from(tabela.querySelectorAll("tbody tr")).map(tr=>Array.from(tr.querySelectorAll("td")).map(td=>td.textContent));
        const indices=headers.map((h,i)=>selecionados.includes(h)?i:-1).filter(i=>i!==-1);
        const heads=indices.map(i=>headers[i]);
        const rows=linhas.map(l=>indices.map(i=>l[i]));
        doc.autoTable({head:[heads],body:rows,startY:40,styles:{fontSize:8,halign:"center"},headStyles:{fillColor:[0,64,128]},didParseCell:data=>{if(data.row.index===rows.length-1){data.cell.styles.fillColor=[0,64,128];data.cell.styles.textColor=255;data.cell.styles.fontStyle="bold";}}});
        const agora=new Date();
        const assinatura=[`Metarica, ${agora.toLocaleDateString('pt-PT',{day:'2-digit',month:'long',year:'numeric'})} ${agora.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}`,"Assinatura","José Eugénio Monteiro","//Técnico de Estatística Sanitária//"];
        let yFinal=doc.lastAutoTable.finalY+20;
        assinatura.forEach(linha=>{const w=doc.getTextWidth(linha);doc.text(linha,(largura-w)/2,yFinal);yFinal+=7;});
        doc.save(`Relatorio_${periodo}.pdf`);
      });

      carregarDados();

    });
  </script>
</body>
</html>
